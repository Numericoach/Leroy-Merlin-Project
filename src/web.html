<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 6px solid #0596DE;
      transition: all 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .info {
      font-size: 14px;
      color: #555;
      margin: 6px 0;
      display: flex;
      align-items: center;
    }
    .info strong {
      color: #333;
      margin-right: 6px;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 12px;
    }
    .badge-open {
      background-color: #e2f0d9;
      color: #385723;
    }
    .btn {
      display: block;
      text-align: center;
      background-color: #0596DE;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #037ab8;
    }
  </style>
</head>
<body>
  <div class="grid">
    <? if (sessions.length === 0) { ?>
      <p>Aucune session disponible pour le moment.</p>
    <? } else { ?>
      <? for (let i = 0; i < sessions.length; i++) { ?>
        <? let session = sessions[i]; ?>
        <? let formUrl = "https://docs.google.com/forms/d/e/" + formId + "/viewform?usp=pp_url&entry.123456789=" + encodeURIComponent(session.title + ' [' + session.id + ']'); ?>
        <div class="card">
          <div>
            <div class="title"><?= session.title ?></div>
            <div class="info"><strong>📅 Date :</strong> <?= session.date ?> (de <?= session.timeRange ?>)</div>
            <div class="info"><strong>🕒 Durée :</strong> <?= session.duration ?></div>
            <div class="info"><strong>📍 Lieu :</strong> <?= session.location ?></div>
            <div class="badge badge-open">🟢 <?= session.remaining ?> places restantes</div>
          </div>
          <a href="<?= formUrl ?>" class="btn" target="_blank">Je m'inscris</a>
        </div>
      <? } ?>
    <? } ?>
  </div>
</body>
</html>
