name: CI / CD

# on qa branch push or pull request
on:
    push:
        branches:
            - qa
    pull_request:
        branches:
            - qa

env:
    script-id: ""

jobs:
    Linting:
        runs-on: ubuntu-latest

        steps:
            - uses: oven-sh/setup-bun@v1
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache node modules
              id: cache-npm
              uses: actions/cache@v3
              env:
                  cache-name: cache-node-modules
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install dependencies
              run: bun install

            - name: Linting code
              run: bun run lint

    Unit-testing:
        runs-on: ubuntu-latest

        steps:
            - uses: oven-sh/setup-bun@v1
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache node modules
              id: cache-npm
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install dependencies
              run: bun install

            - name: Unit Test
              run: bun test

    EnvSetup:
        needs: [Linting, Unit-testing]
        name: Setup Dynamic Environment Variables
        runs-on: ubuntu-latest
        outputs:
            script-id: ${{ steps.set-output.outputs.script-id }}
        steps:
            - uses: oven-sh/setup-bun@v1
            - name: set outputs
              id: set-output
              run: |
                  # use inputs 
                  echo "script-id=${{ env.script-id }}" >> $GITHUB_OUTPUT

    Push-to:
        runs-on: ubuntu-latest
        needs: [EnvSetup]
        if: ${{ needs.EnvSetup.outputs.script-id }}

        steps:
            - uses: oven-sh/setup-bun@v1
            - name: Display ID of the script to push to
              id: display-script-id
              run: echo "Script ID ${{ env.script-id }}"

            - name: Install clasp
              id: install-clasp
              run: bun install @google/clasp@2.4.1 -g

            - name: Write CLASPRC_JSON secret to .clasprc.json file
              id: write-clasprc
              run: echo "$CLASPRC_JSON_SECRET" >> ~/.clasprc.json
              env:
                  CLASPRC_JSON_SECRET: ${{ secrets.CLASPRC_JSON_QA }}

            - name: Check clasp login status
              id: clasp_login
              run: clasp login --status

            - name: Save current .clasprc.json contents to CLASPRC_JSON_FILE environment variable
              id: save-clasprc
              run: |
                  echo ::add-mask::$(tr -d '\n\r' < ~/.clasprc.json)
                  echo "CLASPRC_JSON_FILE=$(tr -d '\n\r' < ~/.clasprc.json)" >> $GITHUB_ENV

            - name: Checkout repo
              id: checkout-repo
              uses: actions/checkout@v4

            - name: Cache node modules
              id: cache-npm
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: |
                      **/node_modules
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/bun.lockb') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install dependencies
              run: bun install

            - name: Set scriptId in .clasp.json file
              id: set-script-id
              if: ${{ env.script-id }}
              run: |
                  echo "Setting scriptId to ${{ env.script-id }}"
                  jq '.scriptId = "${{ env.script-id }}"' .clasp.json > /tmp/.clasp.json && mv /tmp/.clasp.json .clasp.json

            - name: Push script to scripts.google.com
              id: clasp-push
              run: clasp push -f
